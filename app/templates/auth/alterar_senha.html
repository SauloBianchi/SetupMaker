{% extends 'base.html' %}
{% block title %}Alterar Senha — SetupMaker{% endblock %}

{% block content %}
<div style="max-width:480px;">

    <div style="margin-bottom:24px;">
        <h2 style="font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:#e2e8f0;margin-bottom:4px;">
            <i class="bi bi-lock-fill" style="color:#3b82f6;"></i> Alterar Senha
        </h2>
        <p style="color:#64748b;font-size:13px;">Mantenha sua conta segura com uma senha forte</p>
    </div>

    <div class="sm-card">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="sm-label">Senha atual</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-lock-fill input-icon"></i>
                    <input type="password" name="senha_atual" class="sm-input"
                           placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-group">
                <label class="sm-label">Nova senha</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-key-fill input-icon"></i>
                    <input type="password" name="nova_senha" class="sm-input"
                           placeholder="••••••••" required>
                </div>
                <div class="hint-text">
                    <i class="bi bi-info-circle"></i>
                    Mínimo 8 caracteres, 1 maiúscula e 1 número
                </div>
            </div>

            <div class="form-group">
                <label class="sm-label">Confirmar nova senha</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-key-fill input-icon"></i>
                    <input type="password" name="confirmacao" class="sm-input"
                           placeholder="••••••••" required>
                </div>
            </div>

            <div style="display:flex;gap:12px;margin-top:8px;">
                <button type="submit" class="sm-btn sm-btn-primary">
                    <i class="bi bi-check-lg"></i> Salvar senha
                </button>
                <a href="{{ url_for('main.index') }}" class="sm-btn sm-btn-outline">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
